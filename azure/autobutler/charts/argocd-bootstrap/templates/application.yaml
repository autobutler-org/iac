apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autobutler-ci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/autobutler-org/iac.git
    targetRevision: main
    path: gitops/autobutler/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
