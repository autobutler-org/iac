apiVersion: v1
kind: Namespace
metadata:
  name: factory
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: autobutler-factory
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "vaultUrl is required" .Values.vaultUrl | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
# The factory server's connection string, from the factory-database-url secret a person
# writes into the vault after creating the factory role. Until then this reports
# SecretSyncedError and retries. The chart references the Secret; it holds no value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-database
  namespace: factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: autobutler-factory
  target:
    name: factory-database
  data:
    - secretKey: url
      remoteRef:
        key: factory-database-url
---
# Agent workers. restricted Pod Security: a worker Job runs as non-root with no
# privilege escalation and the runtime default seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: factory-workers
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# A backstop, not the scheduler: the workers pool at its ceiling of 3 nodes, less what
# AKS and daemonsets reserve on each. A runaway enqueue stops here rather than at the
# autoscaler. Every worker pod has to set requests and limits for these.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workers
  namespace: factory-workers
spec:
  hard:
    pods: "12"
    requests.cpu: "10"
    requests.memory: 36Gi
    limits.cpu: "12"
    limits.memory: 40Gi
    requests.ephemeral-storage: 300Gi
