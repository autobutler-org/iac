githubConfigUrl: https://github.com/autobutler-org
githubConfigSecret: github-app-private-key
runnerScaleSetName: errand
# Organization runner group. Create it before this scale set syncs. It is not
# the Default group, so a job must name the group and the label.
runnerGroup: errand
minRunners: 0
maxRunners: 100
containerMode:
  type: dind
template:
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
      - key: ci.autobutler.org/runner
        operator: Equal
        value: "true"
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
