# x64-quark-full scale set. runs-on label x64-quark-full, group errand.
# Values stay outside apps/ so this directory sync does not apply them as manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: x64-quark-full
  namespace: argocd
  # Deleting this Application also deletes what it installed. Without the
  # finalizer the scale set is orphaned and keeps running.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: x64-quark-full
        valueFiles:
          - $values/gitops/autobutler/errand/x64/quark/full.yaml
    - repoURL: https://github.com/autobutler-org/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
