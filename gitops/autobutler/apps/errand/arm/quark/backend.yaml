# arm-quark-backend scale set. runs-on label arm-quark-backend, group errand.
# Values stay outside apps/ so this directory sync does not apply them as manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arm-quark-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: arm-quark-backend
        valueFiles:
          - $values/gitops/autobutler/errand/arm/quark/backend.yaml
    - repoURL: https://github.com/autobutler-org/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
