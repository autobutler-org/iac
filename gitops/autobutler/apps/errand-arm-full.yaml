# errand-arm-full scale set. runs-on label errand-arm-full, group errand.
# Values stay outside apps/ so this directory sync does not apply them as manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: errand-arm-full
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: errand-arm-full
        valueFiles:
          - $values/gitops/autobutler/errand/arm/quark/full.yaml
    - repoURL: https://github.com/autobutler-org/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
