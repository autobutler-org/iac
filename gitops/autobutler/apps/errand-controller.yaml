# Actions Runner Controller. Its chart registers the scale-set CRDs, so the
# runner Applications stay on a later sync wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: errand-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.15.1
    helm:
      values: |
        tolerations:
          - key: CriticalAddonsOnly
            operator: Equal
            value: "true"
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The scale-set CRDs are larger than the kubectl last-applied-configuration
    # annotation. Client-side apply rejects them. Server-side apply does not
    # write that annotation.
    syncOptions:
      - ServerSideApply=true
