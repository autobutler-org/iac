# Terraform apply. Runs on push to main -- so an apply always corresponds to a reviewed,
# merged commit -- and on manual dispatch for recovery.
#
# Plan and apply run in one job, so what gets applied is exactly what was planned for this
# commit, and the planfile never leaves the runner. It embeds the configuration and a
# snapshot of state, secrets included, and artifacts of a public repo can be downloaded by
# any signed-in GitHub user, so it must never be uploaded as one.
name: Apply
on:
  push:
    branches:
      - main
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  # Never cancel an apply mid-flight. A half-applied change leaves Azure and the state file
  # disagreeing, which is strictly worse than an apply that waited its turn.
  cancel-in-progress: false
env:
  TERRAFORM_VERSION: "1.16.0"
jobs:
  apply:
    runs-on: ubuntu-latest
    # GitHub creates this environment on first use with no protection rules, so it changes
    # nothing today. It exists so required reviewers, a wait timer, or branch restrictions
    # can be added later in repo settings without touching this file.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # helm_release auths with kubelogin. local_account_disabled means there is no admin
      # client certificate to fall back to.
      - name: Install kubelogin
        run: az aks install-cli

      - name: Init
        run: |
          make init

      - name: Plan
        run: |
          make plan

      - name: Apply
        run: |
          make apply-from-planfile
